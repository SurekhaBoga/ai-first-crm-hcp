services:
  - type: web
    name: surekhaboga-ai-first-crm-hcp-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-first-crm-hcp-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://surekhaboga.github.io
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: DB_ECHO
        value: "false"
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: ai-first-crm-hcp-db
    plan: free
    databaseName: hcp_crm
    user: hcp_crm
